<!-- @dsCard group="Brand" viewport="700x220" name="Logo" subtitle="The BVF mark — deep navy plate, copper rules, serif wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 30px; background:var(--navy-900); display:flex; align-items:center; gap:32px; }
  img { height:150px; width:150px; border-radius:var(--radius-lg); }
  .side { font-family:var(--font-sans); }
  .wm { font-family:var(--font-display); font-weight:700; color:var(--ice); font-size:26px; }
  .wm span { color:var(--copper); }
  .sub { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--copper-300); font-weight:600; margin-top:6px; }
  .note { font-size:12px; color:var(--text-muted); margin-top:14px; max-width:300px; line-height:1.6; }
</style></head>
<body>
  <img src="../assets/bvf-logo.svg" alt="AI BVF logo">
  <div class="side">
    <div class="wm"><span>AI</span> BVF</div>
    <div class="sub">Business Value Framework</div>
    <div class="note">Executive wordmark in Playfair Display. Copper leads the "AI"; navy plate with copper hairline rules top and bottom.</div>
  </div>
</body></html>
