version: 2
updates:
  # npm (the TS monorepo: @aibvf/core, aibvf-mcp, and the app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      # Major toolchain bumps are a deliberate upgrade, not a robot PR:
      # TypeScript 6 / @types/node 26 break the build (see PR #29).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
