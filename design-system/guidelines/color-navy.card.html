<!-- @dsCard group="Colors" viewport="700x150" name="Navy surfaces" subtitle="Deep-navy elevation scale — app base to raised card" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--navy-950); }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:110px; border-radius:var(--radius-md); border:1px solid var(--line);
        display:flex; flex-direction:column; justify-content:flex-end; padding:12px; }
  .n { font-family:var(--font-sans); font-size:11px; font-weight:600; color:var(--ice); }
  .h { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--navy-950)"><span class="n">navy-950</span><span class="h">#0B1626</span></div>
    <div class="sw" style="background:var(--navy-900)"><span class="n">navy-900 · seed</span><span class="h">#0F1E35</span></div>
    <div class="sw" style="background:var(--navy-800)"><span class="n">navy-800</span><span class="h">#172C4B</span></div>
    <div class="sw" style="background:var(--navy-700)"><span class="n">navy-700</span><span class="h">#1F3757</span></div>
    <div class="sw" style="background:var(--navy-600)"><span class="n">navy-600</span><span class="h">#294667</span></div>
  </div>
</body></html>
