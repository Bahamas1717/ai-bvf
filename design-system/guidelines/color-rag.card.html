<!-- @dsCard group="Colors" viewport="700x150" name="RAG verdict" subtitle="Accelerate / Fix / Stop — the framework's core signal" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--navy-900); }
  .row { display:flex; gap:12px; }
  .v { flex:1; padding:16px 18px; border-radius:var(--radius-lg); border:1px solid; }
  .chip { display:inline-block; font-family:var(--font-sans); font-size:10px; font-weight:700;
          letter-spacing:1px; text-transform:uppercase; padding:5px 12px; border-radius:var(--radius-xs);
          border:1px solid; }
  .lab { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:12px; display:block; }
  .acc { background:var(--accelerate-wash); border-color:var(--accelerate-line); }
  .acc .chip { color:var(--accelerate-bright); border-color:var(--accelerate-line); background:var(--accelerate-wash); }
  .fix { background:var(--fix-wash); border-color:var(--fix-line); }
  .fix .chip { color:var(--fix-bright); border-color:var(--fix-line); background:var(--fix-wash); }
  .stop { background:var(--stop-wash); border-color:var(--stop-line); }
  .stop .chip { color:var(--stop-bright); border-color:var(--stop-line); background:var(--stop-wash); }
</style></head>
<body>
  <div class="row">
    <div class="v acc"><span class="chip">Accelerate</span><span class="lab">--accelerate #34C77B</span></div>
    <div class="v fix"><span class="chip">Fix</span><span class="lab">--fix #E9A63C</span></div>
    <div class="v stop"><span class="chip">Stop</span><span class="lab">--stop #E5544C</span></div>
  </div>
</body></html>
