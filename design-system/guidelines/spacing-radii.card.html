<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="Restrained corners; soft dark shadows on navy" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px 26px; background:var(--navy-900); display:flex; gap:18px; align-items:center; }
  .box { width:88px; height:80px; background:var(--navy-700); border:1px solid var(--line);
         display:flex; align-items:flex-end; padding:8px; }
  .n { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .sh { width:110px; height:80px; background:var(--fill-2); border:1px solid var(--line);
        border-radius:var(--radius-lg); display:flex; align-items:flex-end; padding:8px; }
</style></head>
<body>
  <div class="box" style="border-radius:var(--radius-xs)"><span class="n">xs 5</span></div>
  <div class="box" style="border-radius:var(--radius-sm)"><span class="n">sm 6</span></div>
  <div class="box" style="border-radius:var(--radius-md)"><span class="n">md 8</span></div>
  <div class="box" style="border-radius:var(--radius-lg)"><span class="n">lg 10</span></div>
  <div class="box" style="border-radius:var(--radius-xl)"><span class="n">xl 14</span></div>
  <div class="sh" style="box-shadow:var(--shadow-md)"><span class="n">shadow-md</span></div>
  <div class="sh" style="box-shadow:var(--shadow-accent); border-color:var(--copper-line)"><span class="n">accent</span></div>
</body></html>
