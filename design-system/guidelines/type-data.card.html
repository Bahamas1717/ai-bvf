<!-- @dsCard group="Type" viewport="700x150" name="Data / mono" subtitle="IBM Plex Mono — EUR figures, scores, confidence" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px 26px; background:var(--navy-900); display:flex; gap:36px; align-items:center; }
  .cell { text-align:left; }
  .k { font-family:var(--font-sans); font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-muted); font-weight:600; }
  .val { font-family:var(--font-mono); font-weight:600; color:var(--copper-300); font-size:26px; margin-top:6px; }
  .val.big { font-family:var(--font-display); color:var(--ice); }
</style></head>
<body>
  <div class="cell"><div class="k">Net value range</div><div class="val">€10.8M–37.8M</div></div>
  <div class="cell"><div class="k">Decision confidence</div><div class="val big">54</div></div>
  <div class="cell"><div class="k">Verdict</div><div class="val" style="color:var(--fix-bright)">FIX</div></div>
</body></html>
