<!-- @dsCard group="Brand" viewport="700x180" name="The Mirror" subtitle="Signature motif — copper-ruled quote that holds up the mirror" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 26px; background:var(--navy-900); }
  .mirror { padding:22px 26px; background:var(--copper-wash-2);
            border:1px solid var(--copper-line-2); border-left:3px solid var(--copper);
            border-radius:0 var(--radius-lg) var(--radius-lg) 0; }
  blockquote { font-family:var(--font-display); font-style:normal; font-size:19px;
               color:var(--ice); line-height:1.6; margin:0; }
  .attr { margin-top:12px; font-family:var(--font-sans); font-size:13px; color:var(--text-muted); }
</style></head>
<body>
  <div class="mirror">
    <blockquote>Not "can we build it?" — but should this work survive a board review?</blockquote>
    <div class="attr">— The question the framework puts back to every AI initiative</div>
  </div>
</body></html>
