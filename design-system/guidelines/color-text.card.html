<!-- @dsCard group="Colors" viewport="700x150" name="Text on navy" subtitle="Neutral ramp — heading ice to dim meta" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px 24px; background:var(--navy-900); font-family:var(--font-sans); }
  .r { display:flex; align-items:baseline; gap:14px; margin-bottom:9px; }
  .t { font-size:16px; font-weight:500; width:190px; }
  .h { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }
</style></head>
<body>
  <div class="r"><span class="t" style="color:var(--ice)">Ice — headings</span><span class="h">--ice #F4F7FB</span></div>
  <div class="r"><span class="t" style="color:var(--text)">Text — body default</span><span class="h">--text #E7ECF3</span></div>
  <div class="r"><span class="t" style="color:var(--text-body)">Text body — secondary</span><span class="h">--text-body #C3CEDD</span></div>
  <div class="r"><span class="t" style="color:var(--text-muted)">Muted — captions</span><span class="h">--text-muted #94A4BA</span></div>
  <div class="r"><span class="t" style="color:var(--text-dim)">Dim — faint / disabled</span><span class="h">--text-dim #6E809A</span></div>
</body></html>
