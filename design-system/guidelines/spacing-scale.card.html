<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px 26px; background:var(--navy-900); display:flex; gap:18px; align-items:flex-end; }
  .c { text-align:center; }
  .bar { background:var(--copper); border-radius:2px; width:100%; }
  .n { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:8px; display:block; }
</style></head>
<body>
  <div class="c"><div class="bar" style="height:4px"></div><span class="n">1·4</span></div>
  <div class="c"><div class="bar" style="height:8px"></div><span class="n">2·8</span></div>
  <div class="c"><div class="bar" style="height:12px"></div><span class="n">3·12</span></div>
  <div class="c"><div class="bar" style="height:16px"></div><span class="n">4·16</span></div>
  <div class="c"><div class="bar" style="height:24px"></div><span class="n">6·24</span></div>
  <div class="c"><div class="bar" style="height:32px"></div><span class="n">8·32</span></div>
  <div class="c"><div class="bar" style="height:48px"></div><span class="n">12·48</span></div>
</body></html>
