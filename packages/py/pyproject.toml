[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibvf"
version = "0.2.2"
description = "AI BVF — open protocol for scoring AI investments. Validator and scoring engine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Craig Horton" }]
requires-python = ">=3.9"
keywords = ["ai", "bvf", "ai-governance", "enterprise-ai", "ai-scoring", "ai-roi", "eu-ai-act", "standards"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://www.aibvf.com/protocol"
Repository = "https://github.com/Craig-Horton/ai-bvf"
Issues = "https://github.com/Craig-Horton/ai-bvf/issues"

[tool.hatch.build]
include = ["src/aibvf/**", "src/aibvf/schema/*.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/aibvf"]
